name: Release

on:
  push:
    tags: ['v*']
  # Permite testar o empacotamento sem publicar nada.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A release não deve sair de um commit que não passa na verificação.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Empacotar e publicar
        # O electron-builder só publica quando o evento é uma tag; em execução manual, apenas
        # empacota, o que serve para validar o build sem criar release.
        run: pnpm --filter @romorg/desktop exec electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem certificado: desligar explicitamente evita que o electron-builder tente
          # assinar e falhe no meio do empacotamento.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Guardar artefatos
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: romorganizer-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: ignore
