name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  package:
    name: Empacotar (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Empacota sem publicar: garante que o electron-builder funciona nos três
      # sistemas antes de existir release. O `--publish never` é explícito porque o
      # electron-builder publica por conta própria ao detectar CI, e este workflow
      # roda a cada push na main — o que criaria release paralela à do release.yml.
      - name: Build empacotado
        run: pnpm --filter @romorg/desktop exec electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
