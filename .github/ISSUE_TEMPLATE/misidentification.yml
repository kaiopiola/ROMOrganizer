name: Misidentified file
description: A file was identified incorrectly, or not identified at all.
labels: [identification]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach the ROM file.** Size and CRC32 are enough to reproduce.

  - type: input
    id: system
    attributes:
      label: System
      placeholder: snes
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: Extension and size in bytes
      placeholder: .smc — 524800 bytes
    validations:
      required: true

  - type: input
    id: crc
    attributes:
      label: CRC32
      placeholder: a1b2c3d4
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What the app proposed, and what you expected
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ROMOrganizer version and operating system
    validations:
      required: true
