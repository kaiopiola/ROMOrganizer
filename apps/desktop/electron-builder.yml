appId: dev.kaiopiola.romorganizer
productName: ROMOrganizer
copyright: Copyright © 2026 contribuidores do ROMOrganizer

directories:
  output: release
  buildResources: build

files:
  - out/**
  - '!**/*.map'

# Rule packs ficam fora do bundle para poderem ser corrigidos sem uma release nova.
extraResources:
  - from: ../../data/systems
    to: systems
  # As notas de versão vão junto: a aba que as mostra precisa funcionar sem rede.
  - from: ../../changelog
    to: changelog

publish:
  provider: github
  owner: kaiopiola
  repo: ROMOrganizer

mac:
  category: public.app-category.utilities
  # Sem certificado de desenvolvedor: o app não é assinado nem notarizado, e o macOS vai
  # pedir confirmação na primeira abertura. Ver a seção de instalação no README.
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    # O ZIP existe porque é o formato que o electron-updater lê no macOS — mesmo que a
    # instalação automática dependa de assinatura, publicá-lo mantém o caminho pronto para
    # quando houver certificado.
    - target: zip
      arch: [arm64, x64]

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}

linux:
  category: Utility
  # O nome do pacote no monorepo é `@romorg/desktop`, e o electron-builder o usaria como nome
  # do executável — `@` e `/` não são válidos em caminho, e o build falha.
  executableName: romorganizer
  # Sem isto, os ambientes de desktop não associam a janela aberta ao atalho instalado.
  # O nome em si vem do package.json; aqui só se liga a sincronização.
  syncDesktopName: true
  # Obrigatório para empacotar no Linux: sem um mantenedor com email o build falha, e o
  # fallback para o campo `author` do package.json nem sempre é suficiente.
  maintainer: Kaio Piola <kaiopiola@users.noreply.github.com>
  synopsis: Organiza coleções de ROMs identificando os jogos por hash
  target:
    - target: AppImage
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
